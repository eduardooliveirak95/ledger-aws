# ════════════════════════════════════════════════════════════════════════════
# Stack "ledger-github": dá ao GitHub Actions permissão para fazer deploy na AWS
# SEM guardar chaves de acesso no GitHub.
#
# Como funciona (OIDC):
#   1. Em cada execução, o GitHub emite um token assinado que diz "sou o repositório X, ramo Y".
#   2. A AWS confia nesse emissor (o OIDC provider abaixo) e verifica o token.
#   3. Se o repositório e o ramo baterem com a trust policy da role, a AWS devolve
#      credenciais temporárias (1 hora) dessa role.
#
# NÃO é publicada pelo GitHub Actions: cria-se uma vez à mão, com a AWS CLI:
#   aws cloudformation deploy --region eu-west-1 --stack-name ledger-github \
#     --template-file infra/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides GitHubOwner=<o-teu-utilizador-do-github>
# (acrescenta CreateOidcProvider=false se a conta já tiver o provider do GitHub).
# Se mudares este ficheiro, volta a correr esse comando.
# ════════════════════════════════════════════════════════════════════════════
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy the Ledger app without storing any AWS keys in GitHub.
  GitHub proves who it is with a short-lived token (OIDC); only pushes to the main
  branch of YOUR repository can use this role. Deploy this once, by hand.

Parameters:
  # O teu utilizador do GitHub
  GitHubOwner:
    Type: String
    Description: Your GitHub username (e.g. your-username)
  # Nome do repositório
  GitHubRepo:
    Type: String
    Default: ledger-aws
    Description: Repository name
  # Uma conta AWS só pode ter um provider do GitHub; usa "false" se já existir
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Use "false" if this AWS account already has the GitHub OIDC provider (only one is allowed per account)

# Condição: só cria o provider se CreateOidcProvider for "true"
Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  # Regista na conta AWS o GitHub como fornecedor de identidade (emissor de tokens) de confiança
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]   # "audiência" que os tokens do GitHub têm de trazer
      ThumbprintList:                     # impressões digitais dos certificados do GitHub
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # A role que o GitHub Actions assume durante o deploy
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${GitHubRepo}-github-deploy
      Description: Assumed by GitHub Actions to deploy the Ledger app
      MaxSessionDuration: 3600            # as credenciais duram no máximo 1 hora
      # Trust policy: QUEM pode assumir esta role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # O provider criado acima, ou o que já existia na conta
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # O GitHub envia o repositório como "dono/repo" ou, no formato novo,
              # com ids imutáveis: "dono@123/repo@456". Aceitam-se os dois, só no ramo main.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepo}@*:ref:refs/heads/main
      # O SAM precisa de criar roles IAM, Lambda, API Gateway, Cognito, DynamoDB, CloudFront, S3 e Budgets.
      # Numa conta pessoal de aprendizagem, AdministratorAccess simplifica; o que protege a sério é a
      # trust policy acima (só o ramo main do teu repositório pode usar esta role).
      # Numa empresa, esta role teria só as permissões estritamente necessárias.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  # O ARN a pôr no secret AWS_ROLE_ARN do GitHub
  RoleArn:
    Description: Put this in GitHub → Settings → Secrets and variables → Actions → Secrets as AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
