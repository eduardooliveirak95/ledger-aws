# Pipeline do GitHub Actions (CI/CD).
# Cada push para "main" → corre os testes → faz deploy para a AWS.
# Pull requests (de outros ramos) só correm os testes, sem deploy.
name: Test & deploy

# Quando corre
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # botão "Run workflow" no separador Actions (correr à mão)

# Nunca há dois deploys ao mesmo tempo para o mesmo ramo; um novo espera pelo anterior
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # nunca interromper um deploy a meio

# Por omissão, o workflow só pode ler o código do repositório
permissions:
  contents: read

# As ações de terceiros estão presas a um commit (o SHA) e não à versão (@v4): uma versão pode ser
# mudada para apontar para código novo, um commit não. O comentário diz a que versão corresponde.
# Para atualizar uma ação: ver o SHA da versão nova em github.com/<ação>/tags e trocar aqui.

jobs:
  # ── 1.º trabalho: testes (numa máquina Ubuntu nova, criada pelo GitHub) ──
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      # Descarrega o código do repositório para a máquina
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Instala o Python 3.13 (com cache dos pacotes pip para ser mais rápido)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      # Testes do backend com DynamoDB simulado (moto)
      - name: Backend tests
        run: pytest -q

      # Valida os templates CloudFormation (erros de sintaxe, propriedades inválidas...)
      - name: Check the AWS template
        run: cfn-lint template.yaml infra/github-oidc.yaml

      # Verifica a sintaxe de cada ficheiro JavaScript (não executa nada)
      - name: Check the JavaScript syntax
        run: for f in frontend/js/*.js; do node --check "$f"; done

      # Testes da importação dos extratos do banco, do separador Utilizadores e da renovação da sessão
      # (JavaScript do site, corrido no Node sem browser)
      - name: JavaScript tests
        run: node --test tests/bank.test.js tests/admin.test.js tests/auth.test.js

  # ── 2.º trabalho: deploy (só se os testes passarem, e só em push para main) ──
  deploy:
    name: Deploy to AWS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # deixa o GitHub provar a sua identidade à AWS (OIDC, sem chaves guardadas)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      # Instala o AWS SAM CLI
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17   # v2
        with:
          use-installer: true

      # O passo seguinte escreve nos logs "Authenticated as assumedRoleId <id da role>:GitHubActions",
      # e desse id (AROA...) dá para tirar o número da conta. O id fica no secret AWS_ROLE_ID e o
      # add-mask manda o GitHub trocá-lo por *** em todos os passos seguintes.
      - name: Hide the role id in the logs
        env:
          ROLE_ID: ${{ secrets.AWS_ROLE_ID }}
        run: if [ -n "$ROLE_ID" ]; then echo "::add-mask::$ROLE_ID"; fi

      # Troca o token OIDC do GitHub por credenciais temporárias da role (stack ledger-github).
      # O ARN e o email vêm de secrets: o GitHub esconde-os nos logs (aparecem como ***).
      # Enquanto os secrets não existirem, usa as variáveis antigas (que aparecem nos logs).
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a   # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          mask-aws-account-id: true   # esconde o número da conta AWS nos logs

      # O mesmo script que se pode correr à mão: sam deploy + enviar o site + limpar a cache
      - name: Deploy backend + website
        run: bash deploy.sh "${{ secrets.ALERT_EMAIL || vars.ALERT_EMAIL }}"

      # Resumo da execução (página do run no separador Actions). Sem o endereço do site: o repositório
      # e os logs são públicos (o endereço está nos outputs da stack, na consola da AWS)
      - name: Summary
        run: echo "### ✅ Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
